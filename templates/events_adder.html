<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Add Event</title>
</head>

<body class="bg-light">
    <!-- {% include "partials/navbar.html" %} -->
    <nav class="navbar navbar-expand-lg bg-dark px-5">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="#">LoIp</a>
            <button class="navbar-toggler text-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-light" aria-current="page" href="#">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="#">Employees</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex justify-content-center align-items-center vh-100 bg-light">
        <div class="border rounded shadow-lg p-4 mb-5">
            <form id="main-form">
                <div class="mb-3">
                    <label for="event_title" class="form-label">Event Title:</label>
                    <input type="text" class="form-control" id="event_title" name="event_title">
                </div>

                <div class="row">
                    <div class="col mb-3">
                        <label for="event_location" class="form-label">Location:</label>
                        <input type="text" class="form-control" id="event_location" name="event_location">
                    </div>

                    <div class="col mb-3">
                        <label for="event_date" class="form-label">Date:</label>
                        <input type="datetime-local" class="form-control" id="event_date" name="event_date">
                    </div>
                </div>

                <div class="row">
                    <div class="col mb-3">
                        <label for="client_name" class="form-label">Client Name:</label>
                        <input type="text" class="form-control" id="client_name" name="client_name">
                    </div>
                </div>

                <div class="row">
                    <div class="col mb-3">
                        <label for="client_contact" class="form-label">Contact No:</label>
                        <input type="tel" pattern="[0-9]{10}" class="form-control" id="client_contact" name="client_contact">
                    </div>

                    <div class="col mb-3">
                        <label for="client_email" class="form-label">Client Email:</label>
                        <input type="email" class="form-control" id="client_email" name="client_email">
                    </div>
                </div>

                <div class="row px-2 my-2">
                    <button type="submit" class="btn btn-success" onclick="scheduleEvent();">
                        <h5>Add to Schedule</h5>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="/static/events_adder.js"></script>
</body>

</html>

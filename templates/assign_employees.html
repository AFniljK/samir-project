<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Assign Employees</title>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-dark px-5">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="#">LoIp</a>
            <button class="navbar-toggler text-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-light" aria-current="page" href="/events">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="#">Employees</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- {% include "partials/navbar.html" %} -->

    <div class="container-fluid vh-100">
        <div class="row h-100">

            <!-- Available Employees -->
            <div class="col-md-7 mx-4">
                <div class="p-4 pb-0">
                    <h2 class="border-bottom border-dark">Available Employees:</h2>
                </div>
                <div id="events" class="p-4">

                    {% for emp in data.emp_list %}
                    <div class="row mb-4">
                        <div class="card p-5">
                            <h3 class="border-bottom border-dark pb-2">emp.name</h3>
                            <div>
                                <div class="row">
                                    <span class="text-secondary">Contact No: {{ emp.contact }}</span>
                                </div>
                                <div class="row p-4 mt-4 border border-dark rounded">
                                    <button data-id="{{ emp.id }}" class="btn btn-danger col mx-2"
                                        onclick="unassignEmployee(this);">Remove</button>
                                    <button data-id="{{ emp.id }}" class="btn btn-success col mx-2"
                                        onclick="assignEmployee(this);">Add</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% else %}
                    <h2>No Available Employees!</h2>
                    {% endfor %}
                </div>
            </div>

            <!-- Assigned Employees -->
            <div class="col-md-4 bg-light m-4 h-75 d-flex flex-column">
                <div class="p-4">
                    <h3 class="border-bottom border-dark pb-2">Assigned Employees:</h3>

                    <div data-eventID="{{ data.event_id }}" id="ass-emp-list" class="border border-dark p-4 mt-4 rounded">
                    </div>
                </div>
            </div>
        </div>

    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="/static/assign_employees.js"></script>
</body>

</html>
